name: Daily symbol snapshot

on:
  schedule:
    - cron: "7 0 * * *" # 00:07 UTC every day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot TradingView symbols and log changes
        run: python3 scripts/snapshot.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Symbol snapshot $(date -u +%F)"
          git push

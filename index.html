<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watchlist Builder</title>
<meta name="description" content="Live USDT and USDC symbol lists from crypto exchanges, ready to import into TradingView: spot, perps, TradFi">
<script src="shared.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="base.css">
<style>
/* Layout: one column; quote chips, exchange × market matrix, sticky action bar, generated lists. */
/* Header: name on the left, quote choice and the settings gear on the right. */
/* The header stays pinned while the table scrolls; the table's column headers stick right under it (--head-h). */
.top { position: sticky; top: 0; z-index: 4; background: var(--bg); padding-block: max(16px, env(safe-area-inset-top, 0px)) 10px; display: grid; grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: "name quote gear";
  align-items: center; gap: 8px 12px; }
.name { grid-area: name; margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.opts { grid-area: quote; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.field { display: flex; align-items: center; gap: 8px; }
.gearwrap { grid-area: gear; position: relative; display: flex; }

@media (max-width: 680px) {
  .top { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "name gear" "quote quote"; }
  .opts { justify-self: start; }
}
.matrix { overflow: clip; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
/* Fixed layout: each visible market column gets 23% (or an equal share of 76% when there are many), the exchange column the rest. */
table { width: 100%; table-layout: fixed; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 0; border-bottom: 1px solid var(--line); }
thead th { position: sticky; top: var(--head-h, 0px); z-index: 1; background: var(--surface); font-size: 11px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); box-shadow: inset 0 -1px 0 var(--line); }
tbody tr:last-child th, tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--row); }
tbody th { text-align: left; font-weight: 500; white-space: nowrap; }
label.c { display: flex; align-items: center; gap: 7px; padding: 6px 10px; min-height: 34px; cursor: pointer; user-select: none; }
label.c span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
label.c span small { display: block; overflow: hidden; text-overflow: ellipsis; font-size: 11px; font-weight: 400; color: var(--muted); line-height: 1.25; }
/* Same left inset in every cell of a column, header included, so the checkboxes line up vertically. */
td label.c, thead th:not(:first-child) label.c { padding-left: 14px; }
td .n { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
td:has(input:checked) { background: var(--accent-soft); }
td:has(input:checked) .n { color: var(--fg); }
td.off { color: var(--muted); font-family: var(--f-mono); font-size: 12px; }
.bar { position: sticky; bottom: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--bg); border-top: 1px solid var(--line); padding-block: 10px max(10px, env(safe-area-inset-bottom, 0px)); }
.sel { font-size: 13px; color: var(--muted); font-family: var(--f-mono); }
/* Settings: a panel that opens below the gear, right-aligned to it. */
.pop { position: absolute; z-index: 5; right: 0; top: calc(100% + 6px); width: min(300px, calc(100vw - 24px)); display: grid; gap: 12px; padding: 12px 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 28px var(--shadow); }
.pop hr { border: 0; border-top: 1px solid var(--line); margin: 0; }
.pop-link { font-size: 13px; font-weight: 500; color: var(--accent); text-decoration: none; }
.pop-link::after { content: " →"; }
.pop-link:hover { text-decoration: underline; }
.pop-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; }
label.pop-row { cursor: pointer; }
#out { display: grid; gap: 14px; padding-bottom: 24px; scroll-margin-top: 12px; }
.list { display: grid; gap: 6px; }
.list-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.list-head h2 { font-size: 14px; font-weight: 600; margin: 0; }
.list-head .n { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.list-head .acts { margin-left: auto; display: flex; gap: 6px; align-items: center; }
textarea { width: 100%; height: 64px; resize: vertical; font-family: var(--f-mono); font-size: 11.5px; line-height: 1.45;
  padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); }
table.dense td label.c, table.dense thead th:not(:first-child) label.c { flex-direction: column; justify-content: center; gap: 3px; min-height: 44px; padding-left: 2px; padding-right: 2px; }
@media (max-width: 600px) {
  /* Labels read bottom to top, so each starts at its checkbox: checkboxes sit on one line at the bottom of the header. */
  table.dense thead th { vertical-align: bottom; }
  table.dense thead th:not(:first-child) label.c { flex-direction: column-reverse; justify-content: flex-start; }
  table.dense thead th:first-child label.c { align-items: flex-end; }
  table.dense thead th:not(:first-child) label.c span { writing-mode: vertical-rl; transform: rotate(180deg); max-height: 64px; }
  table.dense td .n { font-size: 10px; letter-spacing: -0.02em; }
  label.c { padding: 6px 4px; gap: 6px; }
  tbody th label.c, thead th:first-child label.c { padding-left: 8px; }
  td label.c, thead th:not(:first-child) label.c { flex-direction: column; justify-content: center; gap: 3px; min-height: 44px; padding-left: 4px; }
  thead th { font-size: 10px; letter-spacing: 0.02em; }
  tbody th { font-size: 13px; }
  td .n { font-size: 11px; }
}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <h1 class="name">Watchlist Builder</h1>
    <div class="opts">
      <div class="field">
        <span class="lbl" id="venue-lbl">Venue</span>
        <div class="grp" id="venues" role="group" aria-labelledby="venue-lbl">
          <label class="chip"><input type="checkbox" value="cex" checked> CEX</label>
          <label class="chip"><input type="checkbox" value="dex"> DEX</label>
        </div>
      </div>
      <div class="field">
        <span class="lbl" id="quote-lbl">Quote</span>
        <div class="grp" id="quotes" role="group" aria-labelledby="quote-lbl">
          <label class="chip"><input type="checkbox" value="USDT" checked> USDT</label>
          <label class="chip"><input type="checkbox" value="USDC"> USDC</label>
        </div>
      </div>
    </div>
    <div class="gearwrap">
      <button type="button" class="icon" id="gear" aria-label="Settings" aria-expanded="false" aria-controls="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <div class="pop" id="settings" role="group" aria-label="Settings" hidden>
        <span class="lbl">Table</span>
      <label class="pop-row" for="split"><span>Split TradFi by ticker</span><input type="checkbox" id="split"></label>
      <label class="pop-row" for="fresh"><span>Hide stale (no price 7+ days)</span><input type="checkbox" id="fresh" checked></label>
      <div class="pop-row"><span id="age-lbl">Listed</span>
        <div class="seg" id="age" role="radiogroup" aria-labelledby="age-lbl">
          <label><input type="radio" name="age" value="0" checked><span>All</span></label>
          <label><input type="radio" name="age" value="1"><span>1d</span></label>
          <label><input type="radio" name="age" value="7"><span>7d</span></label>
          <label><input type="radio" name="age" value="30"><span>30d</span></label>
        </div>
      </div>
      <hr>
      <span class="lbl" id="settings-lbl">Generation</span>
        <div class="pop-row"><span id="mode-lbl">Lists</span>
          <div class="seg" id="mode" role="radiogroup" aria-labelledby="mode-lbl">
            <label><input type="radio" name="mode" value="together" checked><span>Together</span></label>
            <label><input type="radio" name="mode" value="separate"><span>Separate</span></label>
          </div>
        </div>
        <label class="pop-row" for="sections"><span>Sections in .txt</span><input type="checkbox" id="sections" checked></label>
        <hr>
        <span class="lbl">Appearance</span>
        <div class="pop-row"><span id="theme-lbl">Theme</span>
          <div class="seg" id="theme" role="radiogroup" aria-labelledby="theme-lbl">
            <label><input type="radio" name="theme" value="auto" checked><span>Auto</span></label>
            <label><input type="radio" name="theme" value="light"><span>Light</span></label>
            <label><input type="radio" name="theme" value="dark"><span>Dark</span></label>
          </div>
        </div>
        <hr>
        <a class="pop-link" href="log.html">Changes log</a>
      </div>
    </div>
  </header>
  <div class="matrix">
    <table>
      <colgroup id="cols"><col style="width:31%"><col><col><col><col></colgroup>
      <thead><tr id="head"></tr></thead>
      <tbody id="body"><tr><td class="off" colspan="5" style="padding:14px">Loading…</td></tr></tbody>
    </table>
  </div>
  <p class="note error" id="loaderr" hidden></p>
  <div class="bar">
    <span class="sel" id="sel">Nothing selected</span>
    <button type="button" class="btn primary" id="go" disabled>Generate</button>
  </div>
  <section id="out" hidden aria-live="polite"></section>
</main>

<script>
// Source: TradingView's public symbol scanner, queried anonymously from this page (it
// allows cross-origin requests and no cookies are sent), so every symbol is importable.
// A derivative without a base currency is a stock, ETF, index, commodity or FX pair: "TradFi".
// Exchanges come from the response itself; TradingView tags every symbol "cex" or "dex" (centralization).
const SCANNER = "https://scanner.tradingview.com/crypto/scan";
const TV_LIMIT = 1000; // symbols per TradingView watchlist
const STALE_DAYS = 7;  // "Hide stale": no price from TradingView for this long (a dead feed, a delisted pair)
const BASE_KINDS = [["spot", "Spot"], ["perp", "Perps"]]; // dated futures left out: few under USDT/USDC, and they expire
const TRADFI = [["tradfi", "TradFi"]];
const TRADFI_SPLIT = [["stock", "Stocks"], ["index", "Indices"], ["metal", "Metals"], ["cmdty", "Commod."], ["fx", "FX"]];
const KIND_FULL = { spot: "Spot", perp: "Perps", tradfi: "TradFi", stock: "Stocks & ETF", index: "Indices", metal: "Metals", cmdty: "Commodities", fx: "FX" };
const KIND_FILE = { spot: "spot", perp: "perps", tradfi: "tradfi", stock: "stocks", index: "indices", metal: "metals", cmdty: "commodities", fx: "fx" };
const SUBS = TRADFI_SPLIT.map(([k]) => k);
const splitOn = () => $("split").checked;
const kinds = () => [...BASE_KINDS, ...(splitOn() ? TRADFI_SPLIT : TRADFI)];
// TradingView has no subtype for TradFi, so the split guesses it from the ticker: FX pairs, metals,
// energy and farm goods, and indices are short known lists; everything else counts as stocks and ETFs.
// On 2026-10-22 it agreed with the exchanges' own classes for 1167 of 1170 symbols (misses: IAU, SLV, H100).
const CCY = "USD|EUR|GBP|JPY|CHF|AUD|NZD|CAD|SGD|HKD|CNH|CNY|SEK|NOK|DKK|PLN|TRY|ZAR|MXN|BRL|ARS|INR|IDR|KRW|TWD|THB|ILS|RUB|HUF|CZK";
const TF_RULES = [
  ["fx", new RegExp(`^(${CCY})(${CCY})$`)],
  ["metal", /^(X(AU|AG|PT|PD)[A-Z]*|XCU|XAL|XNI|XPB\d*|XZN|GOLD(XAU|CIR)?|SILVER(XAG)?|PLATINUM(XPT)?|PALLADIUM(XPD)?|COPPER|ALUMIN(I)?UM(XAL)?|NICKEL(XNI)?|ZINC(XZN)?|LEAD(XPB)?)$/],
  ["cmdty", /^(CL|BZ|NG|NGAS|NATGAS|NATURALGAS(NG)?|USOIL|UKOIL(UST\.P)?|WTIOIL|OILWTI|BRENTOIL|OILBRENT|XTI|XBR|HEATINGOIL|CORN|WHEAT|SOYBEAN|COFFEE|SUGAR|COCOA|COTTON)$/],
  ["index", /^(US30|US100|US500|US2000(USD)?|NAS100|NASDAQ100|NDX100|SP500|SPX500|DJ30|DOWJONES|GER40|DE30EUR|DE40|UK100(GBP)?|FR40(EUR)?|EU50(EUR)?|JP225(USD)?|JPN225|NIKKEI225|HK50(\.P)?|HK33HKD|HSCHKD|AU200AUD|AUS200|KOSPI|KR200|NIFTY50|NIFTYBANK|RUSSELL2000|TECH100|VIX|USDOLLARINDEXDXY|DXY|COIN50|BTCDVOL|[A-Z0-9]+IXUST\.P|[BE]VIVUST\.P)$/],
];
function tradfiSub(symbol) {
  const root = symbol.split(":")[1].replace(/(USDT|USDC)(\.P|\d{2}[A-Z]\d{4})?$/, "");
  return (TF_RULES.find(([, re]) => re.test(root)) || ["stock"])[0];
}

const kindOf = (type, base) => type === "spot" ? "spot" : !base ? "tradfi" : "perp";
const key = (ex, k) => `${ex}|${k}`;
const fmt = n => n.toLocaleString("en-US");

async function scan(exchanges) { // all exchanges when none are given
  const body = { columns: ["exchange", "type", "currency", "base_currency", "centralization", "last-price-update-time", "first_bar_time"], range: [0, 300000],
    filter: [{ left: "type", operation: "in_range", right: ["spot", "swap"] },
             { left: "currency", operation: "in_range", right: ["USDT", "USDC"] }] };
  if (exchanges) body.filter.push({ left: "exchange", operation: "in_range", right: exchanges });
  let r;
  // A plain-text body keeps this a simple CORS request (no preflight).
  try { r = await fetch(SCANNER, { method: "POST", body: JSON.stringify(body), cache: "no-store" }); }
  catch (_) { throw new Error("TradingView did not respond"); }
  if (!r.ok) throw new Error(`TradingView: HTTP ${r.status}`);
  const j = await r.json();
  const staleBefore = Date.now() / 1000 - STALE_DAYS * 86400;
  return j.data.map(x => { const k = kindOf(x.d[1], x.d[3]);
    return { s: x.s, ex: x.d[0], k, sub: k === "tradfi" ? tradfiSub(x.s) : k, q: x.d[2], v: x.d[4], stale: !(x.d[5] > staleBefore), first: x.d[6] || 0 }; });
}

const $ = id => document.getElementById(id);
const head = $("head"), body = $("body"), go = $("go"), out = $("out");
const selected = new Set();
let rows = [], counts = new Map(); // counts: key -> symbols in that cell under the ticked quotes
let exchanges = [], venueOf = {};    // exchange order and "cex" / "dex" per exchange, from the load response

const quotes = () => new Set([...$("quotes").querySelectorAll("input:checked")].map(i => i.value));
const cellOf = r => key(r.ex, splitOn() ? r.sub : r.k);
// "Listed": a symbol is new when its first bar on TradingView, about its listing date, falls within the period.
const listedSince = () => { const d = +form("age"); return d ? Date.now() / 1000 - d * 86400 : 0; };
const wanted = (r, qs, since = listedSince()) => qs.has(r.q) && !(r.stale && $("fresh").checked) && r.first >= since;
function recount() {
  const qs = quotes(), since = listedSince();
  counts = new Map();
  for (const r of rows) if (wanted(r, qs, since)) counts.set(cellOf(r), (counts.get(cellOf(r)) || 0) + 1);
}
const venues = () => new Set([...$("venues").querySelectorAll("input:checked")].map(i => i.value));
function indexExchanges() {
  const tags = {}, total = {};
  for (const r of rows) {
    total[r.ex] = (total[r.ex] || 0) + 1;
    if (r.v) (tags[r.ex] ||= {})[r.v] = ((tags[r.ex] || {})[r.v] || 0) + 1;
  }
  venueOf = Object.fromEntries(Object.keys(total).map(ex => {
    const t = tags[ex] || {};
    return [ex, (t.dex || 0) > (t.cex || 0) ? "dex" : "cex"]; // majority tag; untagged counts as CEX
  }));
  const rank = ex => RANK[ex] ?? Infinity;
  exchanges = Object.keys(total).sort((a, b) => (venueOf[a] === "dex") - (venueOf[b] === "dex") || rank(a) - rank(b) || total[b] - total[a] || a.localeCompare(b));
}
const enabled = (ex, k) => venues().has(venueOf[ex]) && (counts.get(key(ex, k)) || 0) > 0;

function headerBox(label, aria, cells) {
  const th = document.createElement("th");
  th.innerHTML = `<label class="c"><input type="checkbox"> <span></span></label>`;
  th.querySelector("input").setAttribute("aria-label", aria);
  th.querySelector("span").textContent = label;
  th.querySelector("input")._cells = cells;
  return th;
}

function buildTable() {
  const exs = exchanges;
  head.replaceChildren(headerBox("All", "Select the whole table", () => exs.flatMap(ex => kinds().map(([k]) => [ex, k]))));
  for (const [k, label] of kinds()) head.append(headerBox(label, `Select column ${label}`, () => exs.map(ex => [ex, k])));
  body.replaceChildren();
  for (const ex of exs) {
    const tr = document.createElement("tr");
    const { title, sub } = exParts(ex);
    const th = headerBox(title, `Select row ${exName(ex)}`, () => kinds().map(([k]) => [ex, k]));
    if (sub) th.querySelector("span").append(Object.assign(document.createElement("small"), { textContent: sub }));
    th.setAttribute("scope", "row");
    tr.append(th);
    for (const [k, label] of kinds()) {
      const td = document.createElement("td");
      td.dataset.key = key(ex, k);
      td.innerHTML = `<label class="c"><input type="checkbox"> <span class="n"></span></label>`;
      td.querySelector("input").setAttribute("aria-label", `${exName(ex)}: ${label}`);
      td.querySelector("input").addEventListener("change", e => { e.target.checked ? selected.add(td.dataset.key) : selected.delete(td.dataset.key); refresh(); });
      tr.append(td);
    }
    body.append(tr);
  }
  for (const box of document.querySelectorAll("th input")) box.addEventListener("change", () => {
    const cells = box._cells().filter(([ex, k]) => enabled(ex, k));
    const all = cells.length && cells.every(([ex, k]) => selected.has(key(ex, k)));
    for (const [ex, k] of cells) all ? selected.delete(key(ex, k)) : selected.add(key(ex, k));
    refresh();
  });
}

function refresh() {
  // An exchange of an unticked venue, or with nothing under the ticked quotes, is hidden rather than shown as a row of dashes;
  // so is a market column that no visible exchange has (a DEX-only view keeps just Spot).
  for (const tr of body.querySelectorAll("tr")) tr.hidden = ![...tr.querySelectorAll("td")].some(td => enabled(...td.dataset.key.split("|")));
  const shown = kinds().map(([k]) => exchanges.some(ex => enabled(ex, k)));
  for (const tr of [head, ...body.querySelectorAll("tr")]) shown.forEach((on, i) => { tr.children[i + 1].hidden = !on; });
  const n = shown.filter(Boolean).length;
  const per = Math.min(23, 76 / Math.max(n, 1)); // market columns: 23% each (three leave the exchange 31%), more share 76%
  $("cols").innerHTML = `<col style="width:${100 - n * per}%">` + "<col>".repeat(n);
  document.querySelector(".matrix table").classList.toggle("dense", n > 4);
  for (const td of body.querySelectorAll("td")) {
    const n = enabled(...td.dataset.key.split("|")) ? counts.get(td.dataset.key) : 0, box = td.querySelector("input");
    td.classList.toggle("off", !n);
    box.disabled = !n; box.hidden = !n;
    box.checked = !!n && selected.has(td.dataset.key);
    td.querySelector(".n").textContent = n || "—";
  }
  for (const box of document.querySelectorAll("th input")) {
    const cells = box._cells().filter(([ex, k]) => enabled(ex, k));
    const on = cells.filter(([ex, k]) => selected.has(key(ex, k))).length;
    box.disabled = !cells.length;
    box.checked = cells.length > 0 && on === cells.length;
    box.indeterminate = on > 0 && on < cells.length;
  }
  const picked = [...selected].filter(c => enabled(...c.split("|")));
  const total = picked.reduce((s, c) => s + counts.get(c), 0);
  const age = form("age");
  $("sel").textContent = (picked.length ? `${fmt(total)} symbols` : "Nothing selected") + (age !== "0" ? ` · listed ≤ ${age}d` : "");
  go.disabled = !picked.length;
  out.hidden = true;
  last = null;
}

const note = (text, error) => Object.assign(document.createElement("p"), { className: error ? "note error" : "note", textContent: text });
const chunk = (a, n) => a.length <= n ? [a] : Array.from({ length: Math.ceil(a.length / n) }, (_, i) => a.slice(i * n, i * n + n));

// Clipboard API first; if the browser refuses, select the text and try the legacy copy (the selection stays visible).
function copyText(text, ta) {
  const fallback = () => { ta.focus(); ta.select(); try { document.execCommand("copy"); } catch (_) {} };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).catch(fallback);
  else fallback();
}

function confirmClick(el) {
  el.classList.add("done");
  clearTimeout(el._done);
  el._done = setTimeout(() => el.classList.remove("done"), 900);
}

function listBox(list) {
  const text = list.items.join(",");
  const box = document.createElement("div");
  box.className = "list";
  box.innerHTML = `<div class="list-head"><h2></h2><span class="n"></span><div class="acts">
    <button type="button" class="btn ghost">Copy</button><a class="btn ghost">Download</a></div></div>
    <textarea readonly aria-label="Symbols"></textarea>`;
  box.querySelector("h2").textContent = list.title;
  box.querySelector(".n").textContent = fmt(list.items.length);
  const ta = box.querySelector("textarea");
  ta.value = text;
  box.querySelector("button").addEventListener("click", () => copyText(text, ta));
  const a = box.querySelector("a");
  a.href = URL.createObjectURL(new Blob([list.text], { type: "text/plain" }));
  a.download = list.file;
  return box;
}

// Minimal store-only ZIP, so "download all" is one file.
const enc = new TextEncoder();
const CRC = Array.from({ length: 256 }, (_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; return c >>> 0; });
const crc32 = b => { let c = 0xFFFFFFFF; for (const x of b) c = CRC[(c ^ x) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
function zip(files) {
  const parts = [], central = [];
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name), data = enc.encode(f.text), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(12, 0x21, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(14, 0x21, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true);
    ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
    parts.push(lh.buffer, name, data); central.push(ch.buffer, name);
    offset += 30 + name.length + data.length;
  }
  const size = central.reduce((s, p) => s + p.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, size, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end.buffer], { type: "application/zip" });
}

let last = null; // { order, byCell } from the latest Generate; mode and sections re-render it without a new request

async function run() {
  const cells = [...selected].filter(c => enabled(...c.split("|")));
  const exs = [...new Set(cells.map(c => c.split("|")[0]))];
  const qs = quotes();
  go.disabled = true; go.textContent = "Loading…";
  try {
    const fresh = await scan(exs);
    const byCell = new Map(cells.map(c => [c, []]));
    for (const r of fresh) if (wanted(r, qs)) { const c = byCell.get(cellOf(r)); if (c) c.push(r.s); }
    const order = exchanges.flatMap(ex => kinds().map(([k]) => key(ex, k))).filter(c => byCell.has(c) && byCell.get(c).length);
    for (const c of order) byCell.get(c).sort();
    last = { order, byCell };
    render();
  } catch (err) {
    last = null;
    out.replaceChildren(note(err.message, true));
    out.hidden = false;
  }
  go.textContent = "Generate"; go.disabled = false;
  out.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
}

const cellName = c => { const [ex, k] = c.split("|"); return `${exName(ex).replace(/ · /g, " ")} ${KIND_FULL[k]}`; };
const cellLabel = c => { const [ex, k] = c.split("|"); return `${exName(ex)} · ${KIND_FULL[k]}`; };
const cellSlug = c => { const [ex, k] = c.split("|"); return `${ex.toLowerCase()}-${KIND_FILE[k]}`; };

// Fill lists of at most TV_LIMIT entries; with sections on, each "###Name" header takes a slot too.
function pack(groups, sections) {
  const parts = [];
  let cur = [], used = 0;
  for (const { cell, items } of groups) {
    let i = 0;
    while (i < items.length) {
      const room = TV_LIMIT - used - (sections ? 1 : 0);
      if (room <= 0) { parts.push(cur); cur = []; used = 0; continue; }
      const take = items.slice(i, i + room);
      cur.push({ cell, items: take });
      used += take.length + (sections ? 1 : 0);
      i += take.length;
    }
  }
  if (cur.length) parts.push(cur);
  return parts;
}

function render() {
  for (const a of out.querySelectorAll("a[href^=blob]")) URL.revokeObjectURL(a.href);
  out.replaceChildren();
  out.hidden = false;
  const { order, byCell } = last;
  if (!order.length) { out.append(note("No symbols for this selection")); return; }
  const sections = $("sections").checked;
  const together = form("mode") === "together";
  const groups = order.map(cell => ({ cell, items: byCell.get(cell) }));
  let lists;
  if (together) {
    const parts = pack(groups, sections);
    lists = parts.map((g, i) => ({ groups: g,
      title: "Watchlist" + (parts.length > 1 ? ` · part ${i + 1} of ${parts.length}` : ""),
      file: `tradingview-watchlist${parts.length > 1 ? "-part-" + (i + 1) : ""}.txt` }));
  } else {
    lists = groups.flatMap(g => pack([g], sections).map((p, i, arr) => ({ groups: p,
      title: cellLabel(g.cell) + (arr.length > 1 ? ` · part ${i + 1}` : ""),
      file: `tradingview-${cellSlug(g.cell)}${arr.length > 1 ? "-" + (i + 1) : ""}.txt` })));
  }
  for (const l of lists) {
    l.items = l.groups.flatMap(g => g.items);
    l.text = sections ? l.groups.flatMap(g => [`###${cellName(g.cell)}`, ...g.items]).join(",") : l.items.join(",");
  }
  if (together && lists.length > 1) out.append(note(`A TradingView watchlist holds up to ${fmt(TV_LIMIT)} entries, so the list is split into ${lists.length} parts.`));
  if (lists.length > 1) {
    const a = Object.assign(document.createElement("a"), { className: "btn ghost", textContent: `Download all (.zip, ${lists.length} files)`,
      href: URL.createObjectURL(zip(lists.map(l => ({ name: l.file, text: l.text })))), download: "tradingview-watchlists.zip" });
    const row = document.createElement("div"); row.append(a); out.append(row);
  }
  for (const l of lists) out.append(listBox(l));
}

const form = name => document.querySelector(`input[name=${name}]:checked`).value;
const gear = $("gear"), pop = $("settings");
function setPop(open) {
  pop.hidden = !open;
  gear.setAttribute("aria-expanded", String(open));
  if (open) pop.querySelector("input:checked").focus();
}
gear.addEventListener("click", () => setPop(pop.hidden));
document.addEventListener("click", e => { if (!pop.hidden && !pop.contains(e.target) && !gear.contains(e.target)) setPop(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !pop.hidden) { setPop(false); gear.focus(); } });

const STORE = "wb-settings", root = document.documentElement;
function saveSettings() {
  try { localStorage.setItem(STORE, JSON.stringify({ venues: [...venues()], quotes: [...quotes()], split: $("split").checked, fresh: $("fresh").checked, age: form("age"), mode: form("mode"), sections: $("sections").checked, theme: form("theme") })); }
  catch (_) {}
}
function restoreSettings() {
  let st = {};
  try { st = JSON.parse(localStorage.getItem(STORE)) || {}; } catch (_) {}
  if (Array.isArray(st.venues)) for (const i of $("venues").querySelectorAll("input")) i.checked = st.venues.includes(i.value);
  if (Array.isArray(st.quotes)) for (const i of $("quotes").querySelectorAll("input")) i.checked = st.quotes.includes(i.value);
  if (st.mode === "together" || st.mode === "separate") document.querySelector(`input[name=mode][value=${st.mode}]`).checked = true;
  if (typeof st.sections === "boolean") $("sections").checked = st.sections;
  if (typeof st.split === "boolean") $("split").checked = st.split;
  if (typeof st.fresh === "boolean") $("fresh").checked = st.fresh;
  if (["0", "1", "7", "30"].includes(st.age)) document.querySelector(`input[name=age][value="${st.age}"]`).checked = true;
  document.querySelector(`input[name=theme][value=${root.dataset.theme || "auto"}]`).checked = true;
}
function settingsChanged() {
  saveSettings();
  if (last && !out.hidden) render();
}
$("mode").addEventListener("change", settingsChanged);
$("sections").addEventListener("change", settingsChanged);
$("theme").addEventListener("change", () => {
  const t = form("theme");
  if (t === "auto") delete root.dataset.theme; else root.dataset.theme = t;
  saveSettings();
});
$("quotes").addEventListener("change", () => { saveSettings(); recount(); refresh(); });
$("venues").addEventListener("change", () => { saveSettings(); refresh(); });
$("fresh").addEventListener("change", () => { saveSettings(); recount(); refresh(); });
$("age").addEventListener("change", () => { saveSettings(); recount(); refresh(); });
// Switching the split keeps the choice: a ticked TradFi cell becomes all its sub-columns, and back.
$("split").addEventListener("change", () => {
  const on = splitOn();
  for (const c of [...selected]) {
    const [ex, k] = c.split("|");
    if (on && k === "tradfi") { selected.delete(c); for (const sk of SUBS) selected.add(key(ex, sk)); }
    if (!on && SUBS.includes(k)) { selected.delete(c); selected.add(key(ex, "tradfi")); }
  }
  saveSettings();
  if (rows.length) { recount(); buildTable(); refresh(); }
});
restoreSettings();
go.addEventListener("click", run);
const topBar = document.querySelector(".top");
new ResizeObserver(() => root.style.setProperty("--head-h", `${topBar.offsetHeight}px`)).observe(topBar);
out.addEventListener("click", e => { const b = e.target.closest(".btn.ghost"); if (b) confirmClick(b); });

(async () => {
  try { rows = await scan(); }
  catch (err) { $("loaderr").textContent = `${err.message}. Reload the page.`; $("loaderr").hidden = false; return; }
  indexExchanges(); recount(); buildTable(); refresh();
})();
</script>
</body>
